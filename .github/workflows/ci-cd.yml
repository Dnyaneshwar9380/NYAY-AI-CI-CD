name: CI/CD Pipeline

on:
  push:
    branches:
      - feature-branch

jobs:

  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Basic Test
        run: |
          python -m py_compile app.py

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nyay-ai:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nyay-ai:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Verify Secrets
        run: |
          echo "HOST=${{ secrets.EC2_HOST != '' }}"
          echo "USER=${{ secrets.EC2_USER != '' }}"
          echo "KEY=${{ secrets.EC2_KEY != '' }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/nyay-ai:latest

            docker stop nyay-ai || true
            docker rm nyay-ai || true

            docker run -d \
              --name nyay-ai \
              -p 80:5000 \
              ${{ secrets.DOCKER_USERNAME }}/nyay-ai:latest
